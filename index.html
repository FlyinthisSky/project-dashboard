<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Login screen ────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <h1>Project Dashboard</h1>
    <p class="login-tagline">Tous tes projets, centralisés et synchronisés via OneDrive.</p>
    <button class="btn btn-primary" id="btn-login" style="width:100%;justify-content:center;padding:0.75rem 1.5rem;font-size:0.95rem">
      Se connecter avec Microsoft
    </button>
    <p class="login-error" id="login-error" role="alert"></p>
  </div>
</div>

<!-- ── App ─────────────────────────────────────────────────────────────────── -->
<div id="app" hidden>

  <!-- Header -->
  <header class="app-header">
    <h1>Project Dashboard</h1>
    <div class="header-actions">
      <span class="sync-indicator" id="sync-indicator">
        <span class="dot"></span>
        <span class="sync-text">Synced</span>
      </span>
      <span style="font-size:0.8rem;color:var(--text-secondary)" id="account-name"></span>
      <button class="btn btn-primary" id="btn-new-project">&#xFF0B; Nouveau projet</button>
      <button class="btn-icon" id="btn-refresh" title="Rafraichir (R)" aria-label="Rafraichir">&#8635;</button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar" role="search">
    <input type="search" id="search-input" placeholder="Rechercher... (Ctrl+K)" aria-label="Rechercher des projets" />
    <span class="toolbar-label">Statut</span>
    <select id="filter-status" aria-label="Filtrer par statut">
      <option value="all">Tous</option>
      <option value="active">Actif</option>
      <option value="paused">En pause</option>
      <option value="abandoned">Abandonne</option>
      <option value="done">Termine</option>
    </select>
    <span class="toolbar-label">Priorite</span>
    <select id="filter-priority" aria-label="Filtrer par priorite">
      <option value="all">Toutes</option>
      <option value="high">Haute</option>
      <option value="medium">Moyenne</option>
      <option value="low">Basse</option>
    </select>
    <select id="filter-tag" aria-label="Filtrer par tag">
      <option value="all">Tous les tags</option>
    </select>
    <div class="toolbar-spacer"></div>
    <span class="toolbar-label">Tri</span>
    <select id="sort-select" aria-label="Trier par">
      <option value="updated">Derniere modif.</option>
      <option value="created">Date de creation</option>
      <option value="name">Nom A-Z</option>
      <option value="progress">Avancement</option>
    </select>
    <span class="toolbar-meta" id="toolbar-meta"></span>
  </div>

  <!-- Main: dashboard view -->
  <main id="dashboard-view">

    <!-- Projects list -->
    <section aria-label="Liste des projets">
      <div class="section-title">Projets</div>
      <div class="projects-grid" id="projects-list" role="list"></div>
    </section>

    <!-- Focus widget -->
    <section aria-label="En cours">
      <div class="section-title">En cours</div>
      <div id="focus-widget" class="focus-widget"></div>
    </section>

    <!-- Global Gantt -->
    <section aria-label="Planning global">
      <div class="section-title">Planning global</div>
      <div class="chart-card chart-card-full">
        <h3>Tous les sprints</h3>
        <div id="chart-global-gantt"></div>
      </div>
    </section>

  </main>

  <!-- Main: project detail view -->
  <main id="project-view" hidden></main>
</div>

<!-- ── Project dialog ───────────────────────────────────────────────────────── -->
<dialog id="project-dialog" aria-labelledby="dlg-title" aria-modal="true">
  <div class="dialog-head">
    <h2 class="dialog-title" id="dlg-title">Nouveau projet</h2>
    <button class="dialog-close" aria-label="Fermer">&#x2715;</button>
  </div>
  <div class="dialog-body">
    <div class="field">
      <label for="f-name">Nom *</label>
      <input type="text" id="f-name" placeholder="Mon super projet" required autocomplete="off" />
    </div>
    <div class="field">
      <label for="f-description">Description</label>
      <textarea id="f-description" rows="2" placeholder="Ce projet consiste a..."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-status">Statut</label>
        <select id="f-status">
          <option value="active">Actif</option>
          <option value="paused">En pause</option>
          <option value="abandoned">Abandonne</option>
          <option value="done">Termine</option>
        </select>
      </div>
      <div class="field">
        <label for="f-priority">Priorite</label>
        <select id="f-priority">
          <option value="low">Basse</option>
          <option value="medium">Moyenne</option>
          <option value="high">Haute</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-progress">Avancement</label>
      <div class="progress-mode-toggle" role="tablist" aria-label="Mode d'avancement">
        <button type="button" class="mode-btn is-active" data-mode="manual" role="tab" aria-selected="true">Manuel</button>
        <button type="button" class="mode-btn" data-mode="auto" role="tab" aria-selected="false">Auto (tâches)</button>
      </div>
      <div class="range-row" id="f-progress-row">
        <input type="range" id="f-progress" min="0" max="100" step="5" value="0" />
        <span class="range-value" id="f-progress-val">0%</span>
      </div>
      <p class="field-hint" id="f-progress-hint" hidden>Calculé automatiquement à partir des tâches terminées.</p>
    </div>
    <div class="field">
      <label for="f-tech">Langage / Techno</label>
      <input type="text" id="f-tech" placeholder="Python, React, Rust..." autocomplete="off" />
    </div>
    <div class="field">
      <label for="f-tags">Tags <span style="font-weight:400;text-transform:none;letter-spacing:0">(virgule-separes)</span></label>
      <input type="text" id="f-tags" placeholder="perso, web, api..." autocomplete="off" />
    </div>
    <div class="field">
      <label for="f-github">Lien GitHub</label>
      <input type="url" id="f-github" placeholder="https://github.com/..." autocomplete="off" />
    </div>
    <div class="field">
      <label for="f-notes">Notes libres</label>
      <textarea id="f-notes" rows="3" placeholder="Idees, prochaines etapes, liens..."></textarea>
    </div>
  </div>
  <div class="dialog-footer">
    <button class="btn btn-danger" id="btn-dlg-delete" hidden>Supprimer</button>
    <div class="dialog-footer-spacer"></div>
    <button class="btn btn-ghost" id="btn-dlg-cancel">Annuler</button>
    <button class="btn btn-primary" id="btn-dlg-save">Enregistrer</button>
  </div>
</dialog>

<!-- ── Sprint dialog ─────────────────────────────────────────────────────────── -->
<dialog id="sprint-dialog" aria-labelledby="sprint-dlg-title" aria-modal="true">
  <div class="dialog-head">
    <h2 class="dialog-title" id="sprint-dlg-title">Nouveau sprint</h2>
    <button class="dialog-close" aria-label="Fermer">&#x2715;</button>
  </div>
  <div class="dialog-body">
    <div class="field">
      <label for="sf-name">Nom *</label>
      <input type="text" id="sf-name" placeholder="Sprint 1, MVP, Phase alpha..." required autocomplete="off" />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="sf-start">Début *</label>
        <input type="date" id="sf-start" required />
      </div>
      <div class="field">
        <label for="sf-end">Fin *</label>
        <input type="date" id="sf-end" required />
      </div>
    </div>
    <div class="field">
      <label for="sf-status">Statut</label>
      <select id="sf-status">
        <option value="active">Actif</option>
        <option value="done">Terminé</option>
      </select>
    </div>
  </div>
  <div class="dialog-footer">
    <button class="btn btn-danger" id="btn-sprint-delete" hidden>Supprimer</button>
    <div class="dialog-footer-spacer"></div>
    <button class="btn btn-ghost" id="btn-sprint-cancel">Annuler</button>
    <button class="btn btn-primary" id="btn-sprint-save">Enregistrer</button>
  </div>
</dialog>

<!-- ── Confirm dialog ───────────────────────────────────────────────────────── -->
<dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-modal="true">
  <div class="dialog-head">
    <h2 id="confirm-title">Confirmer la suppression</h2>
    <button class="dialog-close" aria-label="Fermer">&#x2715;</button>
  </div>
  <p class="confirm-message"></p>
  <div class="dialog-footer">
    <button class="btn btn-ghost" id="btn-confirm-cancel">Annuler</button>
    <button class="btn btn-danger" id="btn-confirm-ok">Supprimer</button>
  </div>
</dialog>

<!-- ── Toasts ────────────────────────────────────────────────────────────────── -->
<div id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js"></script>
</body>
</html>
